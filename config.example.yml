# Program Mode
mode: "development" # production | development

# Guilds to sync to
guilds: null # None or list of ints

# Bot Configurations
bot:
  secret: "SECRET_HERE" # Discord Bot Secret
  token: "TOKEN_HERE" # Discord Bot Token

  # Openai Configurations

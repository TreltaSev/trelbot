  token: "TOKEN_HERE" # OpenAI Token

# Database configurations
database:
  username: "mongo_user"
  password: "mongo_password"
  host: "bot-database:29345" # Database Host
  root: "bot" # Main Database Used, for auth and data
  uri_override: null # If not null, use this instead and ignore above values